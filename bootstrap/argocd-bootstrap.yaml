apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/managed-by: git

---
# Optional: initial minimal ConfigMap to document where to set repository URL for the self-managed Application.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-bootstrap
  namespace: argocd
data:
  README: |
    This namespace is created for Argo CD. To bootstrap Argo CD manually run:
    
    helm repo add argo https://argoproj.github.io/argo-helm
    helm repo update
    helm dependency update ./helm/argocd

    helm upgrade --install argocd ./helm/argocd \
      --namespace argocd \
      --create-namespace \
      --wait

    After bootstrap, create the self-managed Application in applications/argocd.yaml and Argo CD will manage itself.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/managed-by: gitops
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RaamHorakeri/helm-manifest
    targetRevision: main
    path: applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
