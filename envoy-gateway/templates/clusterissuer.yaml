{{- if .Values.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.certManager.clusterIssuer.name }}
spec:
  acme:
    email: {{ required "certManager.clusterIssuer.email is required" .Values.certManager.clusterIssuer.email | quote }}
    server: {{ .Values.certManager.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.certManager.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: {{ .Values.gateway.name }}
                namespace: {{ .Values.gateway.namespace }}
                kind: Gateway
                sectionName: http
{{- end }}
